name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate Part1
        run: |
          TOTAL=1
          PASSED=0
          FAILED=0

          if python -m py_compile Part1.py; then
            PASSED=$((PASSED+1))
          else
            FAILED=$((FAILED+1))
            echo "[FAIL] Part1.py: syntax error"
          fi

          echo "=============================="
          echo "TOTAL: $TOTAL"
          echo "PASSED: $PASSED"
          echo "FAILED: $FAILED"
          echo "=============================="

      - name: Validate Part2
        run: |
          TOTAL=1
          PASSED=0
          FAILED=0

          if python -m py_compile Part2.py; then
            PASSED=$((PASSED+1))
          else
            FAILED=$((FAILED+1))
            echo "[FAIL] Part2.py: syntax error"
          fi

          echo "=============================="
          echo "TOTAL: $TOTAL"
          echo "PASSED: $PASSED"
          echo "FAILED: $FAILED"
          echo "=============================="
